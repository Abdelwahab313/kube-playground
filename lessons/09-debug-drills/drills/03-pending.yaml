apiVersion: apps/v1
kind: Deployment
metadata:
  name: d03
  namespace: drill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d03
  template:
    metadata:
      labels:
        app: d03
    spec:
      nodeSelector:
        disktype: ssd
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: "8"
              memory: 64Mi
