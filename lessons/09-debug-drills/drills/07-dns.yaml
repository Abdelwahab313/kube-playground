apiVersion: v1
kind: Namespace
metadata:
  name: drill-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: drill-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: drill-data
spec:
  selector:
    app: cache
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: d07
  namespace: drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: d07
  template:
    metadata:
      labels:
        app: d07
    spec:
      containers:
        - name: client
          image: redis:7-alpine
          env:
            - name: REDIS_HOST
              value: cache
          command: [sh, -c]
          args:
            - |
              while true; do
                if redis-cli -h "$REDIS_HOST" -p 6379 ping | grep -q PONG; then
                  echo "$(date +%T) connected to $REDIS_HOST"
                else
                  echo "$(date +%T) cannot reach $REDIS_HOST" >&2
                fi
                sleep 5
              done
