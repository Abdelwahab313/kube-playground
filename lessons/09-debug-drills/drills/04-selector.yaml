apiVersion: apps/v1
kind: Deployment
metadata:
  name: d04
  namespace: drill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d04
  template:
    metadata:
      labels:
        app: d04
        tier: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: d04
  namespace: drill
spec:
  selector:
    app: d04
    tier: backend
  ports:
    - port: 80
      targetPort: 8080
