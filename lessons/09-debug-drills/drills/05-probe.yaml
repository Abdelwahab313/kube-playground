apiVersion: apps/v1
kind: Deployment
metadata:
  name: d05
  namespace: drill
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: d05
  template:
    metadata:
      labels:
        app: d05
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: d05
  namespace: drill
spec:
  selector:
    app: d05
  ports:
    - port: 80
      targetPort: 80
