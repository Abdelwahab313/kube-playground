apiVersion: v1
kind: Pod
metadata:
  name: hog
  labels:
    lesson: "06"
spec:
  containers:
    - name: hog
      image: busybox:1.36
      # tail buffers everything it reads, so this holds ~200Mi in RAM
      command: [sh, -c, "head -c 200m /dev/zero | tail; sleep infinity"]
      resources:
        requests:
          memory: 50Mi
        limits:
          memory: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: spinner
  labels:
    lesson: "06"
spec:
  containers:
    - name: spinner
      image: busybox:1.36
      command: [sh, -c, "while true; do :; done"]
      resources:
        requests:
          cpu: 50m
        limits:
          cpu: 100m
