apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: team-a
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-pod-reader
  namespace: team-a
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: team-a
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: reader-pod
  namespace: team-a
spec:
  serviceAccountName: reader
  containers:
    - name: shell
      image: curlimages/curl:8.10.1
      command: [sh, -c, "sleep infinity"]
