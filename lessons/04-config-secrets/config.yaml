apiVersion: v1
kind: ConfigMap
metadata:
  name: app-cfg
data:
  LOG_LEVEL: info
  FEATURE_X: "true"
  settings.ini: |
    [server]
    workers = 4
    log_level = info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfg-demo
  template:
    metadata:
      labels:
        app: cfg-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "sleep infinity"]
          # style 1: every key of the ConfigMap becomes an env var
          envFrom:
            - configMapRef:
                name: app-cfg
          # style 2: single keys, from a ConfigMap and a Secret
          env:
            - name: GREETING
              value: hello
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          # style 3: keys as files
          volumeMounts:
            - name: cfg
              mountPath: /etc/app
              readOnly: true
      volumes:
        - name: cfg
          configMap:
            name: app-cfg
            items:
              - key: settings.ini
                path: settings.ini
