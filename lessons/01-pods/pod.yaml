apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox:1.36
      command: [sh, -c, "while true; do wget -qO- localhost >/dev/null && echo ok || echo fail; sleep 5; done"]
